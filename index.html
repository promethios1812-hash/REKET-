<script>
  // Saved look (palette, layout, dark mode) applied before first paint (no flash).
  (function () { try { var h = document.documentElement, u = JSON.parse(localStorage.getItem("rekev-ui") || "{}"), pal = u.pal === "greek" ? "navygold" : (u.pal || "classic");
    h.setAttribute("data-pal", pal); if (u.layout === "gm") h.classList.add("gm"); if (localStorage.getItem("rekev-hdr") === "1") h.classList.add("hdr-min");
    if (localStorage.getItem("rekev-theme") === "dark") h.classList.add("dark"); } catch (e) {} })();
</script>
<script>
  // On-device debug console (from rek-tracker): captures console output and errors so problems can be read on a phone.
  (function () {
    const logs = [];
    const str = a => a instanceof Error ? a.name + ": " + a.message : (typeof a === "object" ? (function () { try { return JSON.stringify(a); } catch (e) { return String(a); } })() : String(a));
    const draw = () => { const p = document.getElementById("debugPanel"); if (p) p.textContent = logs.slice(-300).join("\n"); };
    const push = (k, args) => { logs.push("[" + new Date().toLocaleTimeString() + "] [" + k + "] " + Array.from(args).map(str).join(" ")); draw(); };
    ["log", "warn", "error"].forEach(k => { const o = console[k]; console[k] = function () { push(k, arguments); o.apply(console, arguments); }; });
    window.addEventListener("error", e => push("window.onerror", [(e.message || "Script error") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?")]));
    window.addEventListener("unhandledrejection", e => push("unhandledrejection", [e.reason]));
    window.addEventListener("DOMContentLoaded", () => {
      const b = document.getElementById("debugToggleBtn"), p = document.getElementById("debugPanel");
      if (b && p) b.addEventListener("click", () => { p.style.display = p.style.display === "none" ? "block" : "none"; draw(); });
    });
  })();
</script>
